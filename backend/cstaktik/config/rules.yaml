# Konfiguration der Analyse. Alle Schwellen sind HEURISTIKEN (eigene Startwerte,
# keine belegte Quelle). Nach den ersten echten Demos anpassen.

parser:
  # Tickrate der Demo. awpy 2.0.2 liest sie nicht aus dem Header, Default dort ist 128.
  # CS2-Matchmaking-Server laufen mit 64 Tick. Mit der ersten echten Demo prüfen.
  tickrate: 64
  # Positions-Samples pro Sekunde für Replay, Laufwege und Abstandsberechnung.
  position_samples_per_second: 4
  # Economy wird am Tick (Freeze-Ende + Offset) gemessen, damit späte Käufe mitzählen.
  economy_sample_offset_s: 5
  # Granaten-Flugbahn: jeden n-ten Tick behalten (kleinere Reports).
  grenade_sample_ticks: 4

report:
  # Zeichengröße von Smoke/Molotov in Spieleinheiten. Nur Darstellung, keine Spielmechanik.
  smoke_draw_radius_units: 140
  molotov_draw_radius_units: 110
  # Nur wenn die Demo kein Ende-Event liefert: Anzeige-Dauer (CS2-Standard), dann ohne Countdown.
  smoke_default_s: 18
  molotov_default_s: 7

rules:
  death_review:
    enabled: true
    # Weniger HP als das vor dem Duell -> "Wenig HP".
    hp_low: 50
    # Schneller als das (Units/s, aus den Positionen) -> "Im Laufen".
    moving_speed_units_s: 120
    # Schnellere Werte gelten als Datensprung (z. B. Lücke in den Positionen) und werden ignoriert.
    max_plausible_speed_units_s: 400
    # Blendung zählt, wenn sie höchstens so lange vor dem Tod war und mindestens so lange dauerte.
    blind_window_s: 3.0
    blind_min_s: 0.5
    trade_distance_units: 800
    trade_window_s: 3.0
    # Gegner näher als das: "nah" (Ecke vorzielen), sonst "langer Blick" (Linie nicht offen kreuzen).
    close_units: 600
    grenade_keywords: ["grenade", "flashbang", "molotov", "incendiary"]
    ignore_keywords: ["decoy"]

  # Einzelregeln für Tode: standardmäßig aus, death_review fasst sie pro Tod zusammen.
  untraded_death:
    enabled: false
    # Nächster lebender Mitspieler weiter weg als das -> "kein Trade-Partner in der Nähe".
    trade_distance_units: 800
    # Zeitfenster, in dem ein Gegen-Kill auf den Killer als Trade zählt.
    trade_window_s: 3.0
    # Max. Abstand zwischen Todestick und Positions-Sample des Mitspielers.
    max_sample_gap_s: 1.0

  repeated_death_spot:
    enabled: true
    # Ab so vielen Toden am selben Ort (gleicher Place-Name aus der Demo) gibt es ein Finding.
    min_deaths: 2
    # Fallback ohne Place-Name: Tode innerhalb dieses Radius gelten als "gleicher Ort".
    radius_units: 300

  unused_utility:
    enabled: false
    # Inventar-Einträge, die als Utility zählen (Teilstring, Groß/klein egal).
    grenade_keywords: ["grenade", "flashbang", "molotov", "incendiary"]
    # Diese Einträge werden ignoriert.
    ignore_keywords: ["decoy"]
    min_unused: 1

  economy:
    enabled: true
    # Equipment-Wert eines Spielers: <= eco_max gilt als Save, >= full_buy_min als Full-Buy.
    eco_max_equip: 1500
    full_buy_min_equip: 3900
    # Pistolrunden (Premier ist MR12: Runde 1 und 13). Werden nicht bewertet.
    pistol_rounds: [1, 13]
    # Ab dieser Runde Overtime: Economy-Regeln dort aus (anderes Geldsystem).
    overtime_from_round: 25

  entry_deaths:
    enabled: true
    # Ab so vielen Runden als erster Toter gibt es ein Muster-Finding.
    min_count: 3

  no_damage_death:
    enabled: true
    # Ab so vielen Toden ohne vorher gemachten Schaden gibt es ein Muster-Finding.
    min_count: 3

  positives:
    enabled: true
    # Kill auf den Killer eines Mitspielers innerhalb dieses Fensters = Trade gegeben.
    trade_window_s: 3.0
    multi_kill_min: 3

utility_cmp:
  lineup_min_pro: 3         # so viele Pro-Würfe auf denselben Ort braucht ein Lineup-Vergleich
  lineup_good_units: 150    # bis zu diesem Abstand zur Pro-Stelle gilt eine Granate als "sitzt"
  flash_good_blind_s: 1.5   # ab so viel Blendzeit bei Gegnern "wirkt" eine Flash

situation:
  # Entscheidungsmoment: so weit vor dem Tod zurückschauen, mindestens so lange vor dem Tod
  lookback_s: 8
  min_before_s: 1.5
  moving_units_s: 60        # darüber gilt ein Spieler als "in Bewegung"
  alone_units: 1200         # nächster Mitspieler weiter weg = "allein"
  # CS2-Standardzeiten (nicht aus der Demo), nur für "noch ca. x:xx" im Lagebild
  round_time_s: 115
  bomb_time_s: 40
  win_min_rounds: 8         # so viele Runden braucht eine Lage für eine Gewinnchance
  max_moments: 5            # so viele teuerste Momente zeigt der Report
  pro_min_cases: 8          # so viele Pro-Fälle braucht der Vergleich nach Lage

coach:
  # Ursache erscheint im Urteil ab so vielen verlorenen Runden, in denen sie vorkam.
  cause_min_lost_rounds: 2
  max_causes: 3
  max_key_moments: 5
  # Überzahl verspielt: so viele Spieler mehr am Leben und Runde trotzdem verloren.
  advantage_min_lead: 2
  # Duo: Ø Abstand pro Runde darunter gilt als "zusammen gespielt" (Heuristik).
  duo_close_units: 1000
  trade_window_s: 3.0
  # Flash zählt als Blendung ab dieser Dauer (s, aus player_blind).
  blind_min_s: 0.5

goals:
  max_active: 3
  # Zielwert = Ausgangswert x target_factor (Anteil Runden mit dieser Ursache).
  target_factor: 0.6
  # Ziel gilt als geschafft, wenn es so viele Matches in Folge erreicht wurde.
  done_after: 2

mechanics:
  # Schuss gilt als "bewegt", wenn schneller als das (Units/s, aus velocity im Schuss-Tick).
  # Heuristik: im Laufen streuen Waffen stark. Am echten Spiel kalibrieren.
  moving_shot_speed_units_s: 80
  # Schaden bis so viele Ticks nach dem Schuss zählt als Treffer dieses Schusses.
  hit_window_ticks: 2
  # Schüsse mit höchstens diesem Abstand bilden eine Salve.
  burst_gap_s: 0.25
  # "Tod ohne Schuss": kein eigener Schuss in diesem Fenster vor dem Tod.
  no_shot_window_s: 3.0
  # Ab diesen Werten wird ein Mechanik-Ziel vorgeschlagen (Heuristik).
  goal_moving_pct: 30
  goal_no_shot_pct: 30

faceit:
  # Hubs, aus denen Pro-Demos geholt werden. Die ID steht in der Hub-URL auf faceit.com.
  # Vorbelegt: FPL EU laut Community-Beitrag, NICHT bestätigt -> mit "cstaktik faceit-test" prüfen.
  hubs: ["74caad23-077b-4ef3-8b1d-c6a2254dfa75"]
  maps: ["de_mirage", "de_dust2", "de_inferno"]
  # Neue Demos pro Map und Lauf.
  per_map: 3
  # So viele vergangene Matches pro Hub höchstens durchsuchen.
  max_scan: 300
