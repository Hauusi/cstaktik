{# Stil und Verhalten für coach_talk.html (einmal pro Seite einbinden). #}
<style>
.ct { font-size: 16px; line-height: 1.55; }
.ct p { margin: 10px 0 0; }
.ct .ct-open { margin-top: 0; font-size: 20px; font-weight: 700; line-height: 1.35; }
.ct h3 { margin: 22px 0 6px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); }
.ct-good { margin: 6px 0 0; padding-left: 20px; } .ct-good li + li { margin-top: 6px; }
.ct-scene { margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--surface-2); }
.ct-scene p:first-of-type { margin-top: 8px; }
.ct-r { font-family: var(--cond); font-weight: 800; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ct-map { display: block; width: 100%; max-width: 360px; aspect-ratio: 1; margin: 8px auto 0; border-radius: 10px; background: #000; }
.cm-m { fill: #5d79ae; } .cm-f { fill: none; stroke: #e5484d; stroke-width: 2; } .cm-me { fill: #ff9f1c; stroke: #111; stroke-width: 1.5; }
.cm-k { fill: #e5484d; } .cm-shot { stroke: #e5484d; stroke-dasharray: 6 4; } .cm-l { fill: #cfd8ea; font-weight: 700; }
.ct-leg { margin-top: 6px; text-align: center; font-size: 12.5px; }
.ct-better { color: var(--text); } .ct-better b { color: var(--win); }
.ct-link { display: inline-block; margin-top: 10px; color: var(--orange); font-weight: 700; font-size: 14px; }
.ct-deal, .ct-q { margin-top: 18px; padding: 16px; border-radius: 16px; border: 1px solid rgba(255,159,28,.5);
  background: linear-gradient(135deg, rgba(255,159,28,.12), rgba(255,159,28,.02) 60%), var(--surface); }
.ct-q { border-color: rgba(74,138,224,.5); background: linear-gradient(135deg, rgba(74,138,224,.12), rgba(74,138,224,.02) 60%), var(--surface); }
.ct-k { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ct-deal-t, .ct-q-t { font-size: 18px; font-weight: 650; line-height: 1.4; }
.ct-muted { color: var(--muted); font-size: 14.5px; }
.ct .msg { margin-top: 12px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.ct .msg p:first-child { margin-top: 0; } .ct .msg ul { margin: 6px 0 0; padding-left: 20px; }
.ct .msg h3:first-child { margin-top: 0; }
.ct .msg.user { margin-left: 15%; background: var(--surface-2); border-color: transparent; font-size: 15px; }
.ct .msg.wait { color: var(--muted); }
.ct .err { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(240,86,106,.45); color: #f59aa6; font-size: 15px; }
.ct .ask { display: flex; gap: 8px; margin-top: 12px; }
.ct .ask textarea { flex: 1; min-height: 52px; max-height: 160px; padding: 12px 14px; resize: vertical; border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font: inherit; font-size: 16px; }
.ct .ask button { flex: none; min-width: 96px; border: 0; border-radius: 14px; background: var(--orange); color: #111; font: inherit; font-weight: 800; cursor: pointer; }
.ct .ask button:disabled { opacity: .5; cursor: default; }
.ct-foot { margin-top: 14px; color: var(--faint); font-size: 13px; line-height: 1.5; }
.ct-more { display: inline-block; margin-top: 14px; color: var(--orange); font-weight: 700; }
.rp { margin-top: 8px; }
.rp-map { display: block; width: 100%; max-width: 420px; aspect-ratio: 1; margin: 0 auto; border-radius: 10px; background: #000; touch-action: manipulation; }
.rp-bar { display: flex; align-items: center; gap: 10px; max-width: 420px; margin: 8px auto 0; }
.rp-bar button { flex: none; min-width: 40px; height: 36px; border: 0; border-radius: 10px; background: var(--orange); color: #111; font: inherit; font-weight: 800; cursor: pointer; }
.rp-bar .rp-speed { background: var(--surface); color: var(--text); border: 1px solid var(--line); font-size: 13px; }
.rp-seek { flex: 1; min-width: 0; accent-color: var(--orange); }
.rp-t { flex: none; width: 54px; text-align: right; font-size: 13px; color: var(--muted); }
.rp-t.dead { color: var(--loss); font-weight: 800; }
</style>
<script>
(function () {
  document.querySelectorAll("[data-coach]").forEach(function (box) {
    var err = box.querySelector("[data-err]");
    function send(body, btn) {
      err.hidden = true;
      if (btn) btn.disabled = true;
      body.p = box.dataset.sid;
      return fetch("/coach/" + encodeURIComponent(box.dataset.file), {
        method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
      }).then(function (r) {
        return r.json().catch(function () { return {error: "Unerwartete Antwort vom Server."}; });
      }).catch(function () { return {error: "Keine Verbindung zum Server."}; }).then(function (v) {
        if (v.error) {
          err.textContent = v.error; err.hidden = false; if (btn) btn.disabled = false;
          var w = box.querySelector(".msg.wait"); if (w) w.remove();
          return;
        }
        location.reload();
      });
    }
    if (box.dataset.start) send({});
    box.querySelectorAll("form.ask").forEach(function (f) {
      f.addEventListener("submit", function (e) {
        e.preventDefault();
        var t = f.querySelector("textarea"), q = t.value.trim();
        if (!q) return;
        var w = document.createElement("div"); w.className = "msg wait"; w.textContent = "Dein Coach denkt nach …";
        f.parentNode.insertBefore(w, f);
        send({q: q, answer: !!f.dataset.answer}, f.querySelector("button"));
      });
    });
  });

  // Szenen-Wiederholung: Positionen aus der Demo, zwischen den Abtastpunkten weich überblendet
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  var COL = ["#ff9f1c", "#5d79ae", "#e5484d"];
  document.querySelectorAll("[data-replay]").forEach(function (box) {
    var c; try { c = JSON.parse(box.dataset.replay); } catch (e) { return; }
    var svg = box.querySelector("svg"), gN = box.querySelector(".rp-n"), gK = box.querySelector(".rp-k"), gP = box.querySelector(".rp-p");
    var play = box.querySelector(".rp-play"), seek = box.querySelector(".rp-seek"), tl = box.querySelector(".rp-t"), sp = box.querySelector(".rp-speed");
    var F = c.frames, t0 = F[0][0], t1 = F[F.length - 1][0], w = c.vb[2] / 320;
    var drill = box.hasAttribute("data-drill") && c.dec !== null && c.dec !== undefined, answered = false;
    var EV = box.dataset.event || "Tod";
    var dead = {}; c.kills.forEach(function (k) { if (!(k[2] in dead) || k[0] < dead[k[2]]) dead[k[2]] = k[0]; });
    var dots = c.ids.map(function (p, i) {
      var g = el("g", {}), r = (i === 0 ? 8 : 6) * w;
      g.appendChild(el("circle", {r: r, fill: COL[p.t], stroke: "#111", "stroke-width": 1.5 * w}));
      var tx = el("text", {x: r + 2 * w, y: 4 * w, "font-size": 11 * w, fill: p.t === 2 ? "#ffb3bd" : "#dfe6f3", "font-weight": 700});
      tx.textContent = i === 0 ? "du" : p.n; g.appendChild(tx);
      g.style.display = "none"; gP.appendChild(g); return g;
    });
    function posAt(i, t) {
      var a = null, b = null;
      for (var f = 0; f < F.length; f++) {
        var q = null; F[f][1].forEach(function (x) { if (x[0] === i) q = x; });
        if (!q) continue;
        if (F[f][0] <= t) a = [F[f][0], q[1], q[2]]; else { b = [F[f][0], q[1], q[2]]; break; }
      }
      if (!a) return null;
      if (!b || b[0] - a[0] > 1.5) return t - a[0] > 0.6 ? null : [a[1], a[2]];
      var u = (t - a[0]) / (b[0] - a[0]);
      return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
    }
    var last = {};
    function draw(t) {
      gN.innerHTML = ""; gK.innerHTML = "";
      c.nades.forEach(function (n) {
        var a = n[0], b = n[1], k = n[2];
        if (k === "smoke" || k === "molotov") {
          if (t < a || t > b) return;
          gN.appendChild(el("circle", {cx: n[3], cy: n[4], r: n[5], fill: k === "smoke" ? "rgba(190,198,210,.55)" : "rgba(255,122,28,.45)",
            stroke: k === "smoke" ? "#c9d1dd" : "#ff7a1c", "stroke-width": 1.5 * w}));
        } else if (t >= a && t < a + 0.5) {
          gN.appendChild(el("circle", {cx: n[3], cy: n[4], r: (k === "flash" ? 26 : 20) * w * (0.5 + (t - a)),
            fill: k === "flash" ? "rgba(255,255,255,.75)" : "rgba(255,210,80,.6)"}));
        }
      });
      c.ids.forEach(function (p, i) {
        var d = dead[i], q = (d !== undefined && t >= d) ? null : posAt(i, t);
        if (q) { last[i] = q; dots[i].style.display = ""; dots[i].setAttribute("transform", "translate(" + q[0] + "," + q[1] + ")"); }
        else {
          dots[i].style.display = "none";
          var lp = d !== undefined && t >= d ? (posAt(i, d - 0.05) || last[i]) : null;
          if (lp) {
            var x = lp[0], y = lp[1], s = 6 * w;
            gK.appendChild(el("path", {d: "M" + (x - s) + " " + (y - s) + "L" + (x + s) + " " + (y + s) + "M" + (x + s) + " " + (y - s) + "L" + (x - s) + " " + (y + s),
              stroke: COL[p.t], "stroke-width": 3 * w, "stroke-linecap": "round"}));
          }
        }
      });
      c.kills.forEach(function (k) {
        if (k[1] === null || t < k[0] || t > k[0] + 0.9) return;
        var pa = posAt(k[1], k[0]) || last[k[1]], pv = posAt(k[2], k[0] - 0.05) || last[k[2]];
        if (!pa || !pv) return;
        gK.appendChild(el("line", {x1: pa[0], y1: pa[1], x2: pv[0], y2: pv[1],
          stroke: "#ffdf6b", "stroke-width": 2.5 * w, "stroke-dasharray": (6 * w) + " " + (4 * w)}));
      });
      var dt = Math.round(t * 10) / 10;
      tl.textContent = dt < 0 ? (dt.toFixed(1).replace(".", ",") + " s") : (dt === 0 ? EV : "+" + dt.toFixed(1).replace(".", ",") + " s");
      tl.classList.toggle("dead", t >= 0);
      seek.value = Math.round(1000 * (t - t0) / (t1 - t0));
    }
    var t = t0, speed = 1, running = false, prev = 0;
    function step(ts) {
      if (!running) return;
      if (prev) t += (ts - prev) / 1000 * speed;
      prev = ts;
      if (drill && !answered && t >= c.dec) {  // Entscheidungsmoment: anhalten und fragen
        t = c.dec; running = false; play.textContent = "?"; draw(t);
        box.classList.add("ask"); box.dispatchEvent(new CustomEvent("rp:dec", {bubbles: true}));
        return;
      }
      if (t >= t1) { t = t1; running = false; play.textContent = "↻"; }
      draw(t);
      if (running) requestAnimationFrame(step);
    }
    function start() { if (t >= t1) { t = t0; last = {}; } running = true; prev = 0; play.textContent = "❚❚"; requestAnimationFrame(step); }
    box._answered = function () { answered = true; box.classList.remove("ask"); start(); };
    play.addEventListener("click", function () {
      if (drill && !answered && t >= c.dec - 0.01) return;  // erst entscheiden
      if (running) { running = false; play.textContent = "▶"; } else start();
    });
    sp.addEventListener("click", function () { speed = speed === 1 ? 0.5 : speed === 0.5 ? 2 : 1; sp.textContent = (speed === 0.5 ? "½" : speed) + "×"; });
    seek.addEventListener("input", function () {
      running = false; play.textContent = "▶"; t = t0 + (t1 - t0) * seek.value / 1000;
      if (drill && !answered && t > c.dec) t = c.dec;  // vor der Entscheidung nicht vorspulen
      draw(t);
    });
    draw(t0);
    // spielt einmal von selbst, sobald die Szene sichtbar ist (in der Story erst, wenn ihr Schritt dran ist)
    var seen = false, inView = false, step0 = box.closest(".sx");
    function maybe() {
      if (seen || !inView || (step0 && !step0.classList.contains("on"))) return;
      seen = true; start();
    }
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (es) { es.forEach(function (e) { inView = e.isIntersecting; maybe(); }); },
                               {threshold: 0.6}).observe(svg);
    }
    if (step0 && "MutationObserver" in window) new MutationObserver(maybe).observe(step0, {attributes: true, attributeFilter: ["class"]});
  });

  // Entscheidungen in Szenen: Wahl speichern, auflösen, Szene weiterlaufen lassen
  function post(url, body) {
    return fetch(url, {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"},
                       body: JSON.stringify(body)}).then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  var ctx = document.querySelector("[data-session]");
  var who = ctx ? {p: ctx.dataset.sid || ""} : {};
  document.querySelectorAll(".dr").forEach(function (dr) {
    var box = dr.parentNode.querySelector(".rp"), choice = null;
    function reveal(reason) {
      dr.dataset.done = "1";
      dr.querySelectorAll(".dr-o").forEach(function (o) {
        o.disabled = true;
        if (o.dataset.choice === dr.dataset.aktion) o.classList.add("mine");
        if (o.dataset.choice === dr.dataset.best) o.classList.add("best");
        if (o.dataset.reason && o.dataset.reason === reason) o.classList.add("pick");
        var r = o.querySelector(".dr-r"); if (r && r.textContent.trim()) r.hidden = false;
      });
      var cue = dr.querySelector(".dr-cue");
      if (cue) {
        var mine = reason ? dr.querySelector('[data-reason="' + reason + '"]') : null;
        cue.textContent = !reason ? "" : reason === cue.dataset.cue
          ? "Genau darauf kommt es hier an: " + cue.dataset.label + "."
          : "Du hast vor allem darauf geachtet: " + mine.textContent.trim() + ". Hier zählt vor allem: " + cue.dataset.label + ".";
      }
      dr.querySelectorAll(".dr-q").forEach(function (q) { q.hidden = true; });
      dr.querySelector(".dr-res").hidden = false;
      if (box && box._answered) box._answered();
      post("/session/answer", Object.assign({key: dr.dataset.key, choice: choice, reason: reason || ""}, who));
    }
    dr.querySelectorAll(".dr-o[data-choice]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (choice) return; choice = b.dataset.choice;
        b.classList.add("pick");
        dr.querySelectorAll(".dr-o[data-choice]").forEach(function (o) { o.disabled = true; });
        var why = dr.querySelector(".dr-why");
        if (why) why.hidden = false; else reveal(null);  // erst begründen, dann auflösen (Selbsterklärung)
      });
    });
    dr.querySelectorAll(".dr-w").forEach(function (b) {
      b.addEventListener("click", function () { if (choice && !dr.dataset.done) reveal(b.dataset.reason); });
    });
  });
  document.querySelectorAll(".ck").forEach(function (ck) {
    var sec = ck.parentNode;
    ck.querySelectorAll(".ck-o").forEach(function (b) {
      b.addEventListener("click", function () {
        if (ck.dataset.done) return; ck.dataset.done = "1";
        var ok = b.dataset.text === ck.dataset.plan;
        ck.querySelectorAll(".ck-o").forEach(function (o) {
          o.disabled = true;
          o.classList.add(o.dataset.text === ck.dataset.plan ? "right" : (o === b ? "no" : "x"));
        });
        var res = ck.querySelector(".ck-res"); res.hidden = false;
        res.querySelector(".ck-v").textContent = ok ? "Genau. Den Plan hattest du im Kopf." : "Nicht ganz. Das war dein Plan (grün). Gut, dass du ihn jetzt noch einmal siehst.";
      });
    });
    ck.querySelectorAll(".ck-r").forEach(function (b) {  // Selbsteinschätzung, dann die gemessenen Zahlen
      b.addEventListener("click", function () {
        ck.querySelectorAll(".ck-r").forEach(function (o) { o.classList.toggle("on", o === b); });
        var m = sec.querySelector(".ck-meas"); if (m) m.hidden = false;
        post("/session/rate", Object.assign({report: ctx && ctx.dataset.file, rating: b.dataset.rating}, who));
      });
    });
  });
  document.querySelectorAll(".pl").forEach(function (pl) {
    var text = (pl.querySelector(".pl-o.on") || {}).dataset ? pl.querySelector(".pl-o.on").dataset.text : null;
    var ob = (pl.querySelector(".pl-b.on") || {dataset: {}}).dataset.obstacle || "";
    function save() {
      return post("/session/plan", Object.assign({report: ctx && ctx.dataset.file, lesson: pl.dataset.lesson, text: text, obstacle: ob}, who))
        .then(function (ok) {
          pl.querySelector(".pl-ok").hidden = !ok;
          pl.querySelectorAll(".pl-ob, .pl-cue").forEach(function (e) { e.hidden = !ok; });
        });
    }
    pl.querySelectorAll(".pl-o").forEach(function (b) {
      b.addEventListener("click", function () {
        pl.querySelectorAll(".pl-o").forEach(function (o) { o.classList.toggle("on", o === b); });
        text = b.dataset.text; save();
      });
    });
    pl.querySelectorAll(".pl-b").forEach(function (b) {  // Hindernis und Gegenplan (mentales Kontrastieren)
      b.addEventListener("click", function () {
        pl.querySelectorAll(".pl-b").forEach(function (o) { o.classList.toggle("on", o === b); });
        ob = b.dataset.obstacle; pl.querySelector(".pl-line").textContent = b.dataset.line; save();
      });
    });
  });
})();
</script>
