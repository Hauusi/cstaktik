<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>{% block title %}cstaktik{% endblock %}</title>
<style>{{ font_css()|safe }}</style>
<style>
:root {
  --bg: #0b0d12; --surface: #141821; --surface-2: #1b202b; --line: rgba(255,255,255,.07);
  --text: #eef1f6; --muted: #8d97a8; --faint: #5d6676;
  --accent: #ff9f1c; --accent-2: #4a8ae0; --win: #3fbf7f; --loss: #f0566a; --warn: #f5a524;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main, .hero-in { max-width: 560px; margin: 0 auto; }
main { padding: 0 16px 48px; }
a { color: inherit; text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }
.hero { padding: 30px 16px 26px;
  background: radial-gradient(120% 140% at 0% 0%, rgba(255,159,28,.38), transparent 55%),
              radial-gradient(120% 140% at 100% 0%, rgba(255,159,28,.28), transparent 55%), var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; letter-spacing: .02em; }
.logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--orange); box-shadow: 0 6px 18px rgba(255,159,28,.35); }
.logo svg { width: 18px; height: 18px; }
.hero h1 { margin: 18px 0 4px; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--muted); }
h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.btn { width: 100%; height: 52px; border: 0; border-radius: 14px; font: inherit; font-weight: 700; font-size: 16px; color: #fff;
  background: var(--orange); box-shadow: 0 8px 24px rgba(255,159,28,.3); cursor: pointer; }
.btn:disabled { opacity: .45; box-shadow: none; cursor: default; }
.bar { position: relative; height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 6px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }
.bar.indet > i { width: 35% !important; animation: indet 1.3s ease-in-out infinite; }
@keyframes indet { from { left: -35%; } to { left: 100%; } }
.stats { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 13px; }
.stats b { color: var(--text); font-weight: 650; }
.muted { color: var(--muted); } .small { font-size: 13px; }
/* Desktop: breitere Seite, Spalten */
@media (min-width: 960px) {
  body.wide main, body.wide .hero-in { max-width: 1160px; }
  body.wide main { padding: 0 32px 64px; box-sizing: border-box; }
  .hero { padding: 40px 0 34px; }
  body.wide .hero-in, .hero-in { padding: 0 32px; box-sizing: border-box; }
  .hero h1 { font-size: 38px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 36px; align-items: start; }
}
.err { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(240,86,106,.1); border: 1px solid rgba(240,86,106,.35); color: #ffc9d0; }

/* ---- HUD-Design ---- */
.hero { background: linear-gradient(90deg, rgba(255,159,28,.09), transparent 60%), var(--bg) !important;
  border-bottom: 2px solid var(--orange); }
.logo { background: var(--orange) !important; box-shadow: none !important; border-radius: 2px !important;
  clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 100%, 0 100%); }
.logo svg { stroke: #111 !important; }
.brand { font-family: var(--cond); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; }
.hero h1 { font-size: 40px; line-height: 1; }
.bar > i { background: var(--orange) !important; }
.card, .item { background: var(--surface); border: 1px solid var(--line); }
.mapbtn { font-family: var(--cond); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.bst .brow b, .goal b, .note b { font-family: var(--cond); font-size: 20px; text-transform: uppercase; letter-spacing: .01em; }
{% include 'ui.css' %}
{% include 'hud.css' %}
{% include 'modern.css' %}
</style>
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}wide{% endblock %}">
{% include "nav.html" %}
  <header class="hero"><div class="hero-in">
    <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></span>cstaktik</a>
    {% block hero %}{% endblock %}
  </div></header>
<main>
  {% block content %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
