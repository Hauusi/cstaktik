{% extends "base.html" %}
{% block title %}Login · cstaktik{% endblock %}
{% block head %}<style>.gnav { display: none !important; } body { padding-bottom: 0 !important; }
.login { max-width: 380px; margin: 24px auto 0; display: grid; gap: 10px; }
.login label { font-size: 13px; color: var(--muted); }</style>{% endblock %}
{% block hero %}<h1>Login</h1><p>Dein Coach wartet.</p>{% endblock %}
{% block content %}
<form class="card login" method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="n">Name</label><input class="field" id="n" name="name" autocomplete="username" required autofocus>
  <label for="p">Passwort</label><input class="field" id="p" name="password" type="password" autocomplete="current-password" required>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <button class="btn" type="submit">Einloggen</button>
</form>
{% endblock %}
