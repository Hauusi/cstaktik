{# Upload-Formular, pro_mode=True speichert als Pro-Referenz #}
<form class="{{ 'upform' if embedded else 'card' }}" id="form" action="/analyze" method="post" enctype="multipart/form-data">
  <label class="drop" id="drop">
    <input type="file" name="demo" id="file" accept=".dem,.gz,.bz2,.zst,.zip,.rar" required>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#ffc46b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></div>
    <b id="fname" data-empty="{{ "Pro-Demo wählen" if pro_mode else "Demo wählen oder hierher ziehen" }}">{{ "Pro-Demo wählen" if pro_mode else "Demo wählen oder hierher ziehen" }}</b>
    <span class="muted small" id="fsize">.dem, .dem.gz, .dem.bz2, .dem.zst, .zip oder .rar</span>
  </label>
  {% if pro_mode %}<input type="hidden" name="pro" value="1">{% endif %}
  {% if not pro_mode %}<details><summary>Andere Spieler analysieren (SteamID64)</summary>
    <input class="field" type="text" name="steamids" placeholder="SteamID64, kommagetrennt"></details>{% endif %}
  <button class="btn" id="go" type="submit" disabled hidden>{{ "Als Pro-Referenz speichern" if pro_mode else "Analysieren" }}</button>
  <div id="up">
    <div class="bar"><i id="upbar"></i></div>
    <div class="stats num"><span id="uppct">Upload 0 %</span><span id="uprate"></span><span id="upeta"></span></div>
    <p class="muted small" style="margin:10px 0 0">Während des Uploads Handy wach lassen. Danach läuft alles auf dem Server weiter.</p>
  </div>
  <div class="err" id="uperr" hidden></div>
</form>
<script>
(() => {
const $ = id => document.getElementById(id);
const fmtMB = b => (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB';
const fmtT = s => { s = Math.max(0, Math.round(s)); return s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' min' : s + ' s'; };
let busy = false;  // läuft schon ein Upload: keine zweite Datei parallel starten
const manual = () => { const d = $('form').querySelector('details'); return d && (d.open || (d.querySelector('input').value || '').trim()); };
$('file').onchange = e => {
  if (busy) return;
  const f = e.target.files[0];
  $('fname').textContent = f ? f.name : $('fname').dataset.empty;
  $('fsize').textContent = f ? fmtMB(f.size) : '.dem, .dem.gz, .dem.bz2, .dem.zst, .zip oder .rar';
  $('drop').classList.toggle('has', !!f); $('go').disabled = !f;
  if (!f) return;
  if (manual()) { $('go').hidden = false; return; }  // andere Spieler eintragen: erst auf "Analysieren" warten
  const fm = $('form');  // Datei gewählt = los; ältere Safari kennen requestSubmit nicht
  fm.requestSubmit ? fm.requestSubmit() : fm.dispatchEvent(new Event('submit', { cancelable: true }));
};
// Am PC: Datei einfach auf das Feld ziehen
['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => { if (!busy && e.dataTransfer.files.length) { $('file').files = e.dataTransfer.files; $('file').dispatchEvent(new Event('change')); } });
$('form').onsubmit = e => {
  e.preventDefault();
  if (busy || !$('file').files.length) return;
  const fd = new FormData($('form'));  // vor dem Sperren: gesperrte Felder fehlen sonst im Formular
  busy = true; $('file').disabled = true;
  const xhr = new XMLHttpRequest(), t0 = performance.now();
  $('go').disabled = true; $('go').textContent = 'Lädt hoch …'; $('fsize').textContent = 'Wird hochgeladen …'; $('up').classList.add('show'); $('uperr').hidden = true;
  xhr.upload.onprogress = ev => {
    if (!ev.lengthComputable) return;
    const p = ev.loaded / ev.total, dt = (performance.now() - t0) / 1000, rate = ev.loaded / Math.max(dt, .001);
    $('upbar').style.width = (p * 100) + '%';
    $('uppct').textContent = 'Upload ' + Math.floor(p * 100) + ' %';
    $('uprate').textContent = fmtMB(rate) + '/s';
    $('upeta').textContent = p < 1 ? 'noch ' + fmtT((ev.total - ev.loaded) / rate) : 'wird gespeichert …';
  };
  xhr.onload = () => {
    if (xhr.status < 400) { location.href = xhr.responseURL; return; }
    let msg = 'Fehler ' + xhr.status; try { msg = JSON.parse(xhr.responseText).detail || msg; } catch (_) {}
    fail(msg);
  };
  xhr.onerror = () => fail('Verbindung abgebrochen. Handy während des Uploads wach lassen und erneut versuchen.');
  function fail(msg) { busy = false; $('file').disabled = false; $('uperr').textContent = msg; $('uperr').hidden = false; $('go').hidden = false; $('go').disabled = false; $('go').textContent = 'Erneut versuchen'; }
  xhr.open('POST', '/analyze'); xhr.send(fd);
};
})();
</script>
