<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Fortschritt – cstaktik</title>
<style>{{ font_css|safe }}</style>
<style>
:root { --bg: #0b0d12; --surface: #141821; --surface-2: #1b202b; --line: rgba(255,255,255,.07);
  --text: #eef1f6; --muted: #8d97a8; --faint: #5d6676; --win: #3fbf7f; --loss: #f0566a; --warn: #f5a524; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
a { color: inherit; } .num { font-variant-numeric: tabular-nums; }
.hero { margin: 0 -16px; padding: 26px 20px 22px; border-bottom: 2px solid var(--orange);
  background: linear-gradient(90deg, rgba(255,159,28,.09), transparent 60%), var(--bg); }
.hero h1 { margin: 10px 0 4px; font-size: 42px; line-height: 1; letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--muted); }
h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
@media (min-width: 1000px) { main { max-width: 1160px; padding: 0 32px 64px; } }
{% include 'hud.css' %}
{% include 'modern.css' %}
</style>
<script>{{ callouts_js|safe }}</script>
</head>
<body>
<main>
  <header class="hero">
    <h1>Fortschritt</h1>
    <p class="num">{{ data.matches|length }} Match{{ "es" if data.matches|length != 1 }} ausgewertet ·
      {{ data.matches|map(attribute="won")|sum }}:{{ data.matches|map(attribute="lost")|sum }} Runden gesamt</p>
  </header>
  {% include "karte_core.html" %}
</main>
</body>
</html>
