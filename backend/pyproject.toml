[project]
name = "cstaktik"
version = "0.1.0"
description = "CS2-Coach: Post-Match-Analyse eigener Premier-Demos"
requires-python = ">=3.11"
dependencies = [
    "awpy==2.0.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cstaktik = "cstaktik.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cstaktik*"]

[tool.setuptools.package-data]
cstaktik = ["config/*.yaml", "report/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
